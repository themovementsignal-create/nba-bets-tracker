name: Build

# Every push builds the app. Only pushes to main publish a GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check signing secrets
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            if [ "$IS_MAIN" = "true" ]; then
              echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::warning::No signing secrets: building an unsigned APK just to check the code compiles."
          fi

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$APK" "dist/training-build-${{ github.run_number }}.apk"
          ls -l dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: training-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Upload database schema
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-${{ github.run_number }}
          path: app/schemas
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: env.IS_MAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA" \
            --latest
