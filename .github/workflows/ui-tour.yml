name: UI tour

# Boots an Android emulator, clicks through every screen and saves screenshots to the
# `ci-screenshots` branch so changes can be checked visually before they reach main.
on:
  push:
    branches-ignore: [main, ci-screenshots]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/ui-tour.sh

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q
          git checkout -q -b ci-screenshots
          echo "Run ${{ github.run_number }} on ${{ github.ref_name }} @ ${GITHUB_SHA::7}" > RUN.txt
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "UI tour run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Fail if the tour failed
        run: test "$(cat out/tour-result.txt 2>/dev/null)" = "PASS"
